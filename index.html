<h1>سَّكِينَة</h1>

<p>
هنا تجد ما يطمئن قلبك.
</p>
<div class="daily-message">
<p>
<h2> </h2>
<p>
<p class="message"></p>
</p>
<script>
const messages = [
"لعلّ الله يدبر لك ما هو خير مما تتمنى.",
"اطمئن، ما كُتب لك سيأتيك ولو تأخر.",
"الله لا ينسى قلبًا دعاه.",
"كل تأخير فيه لطف لا تدركه الآن.",
"ما عند الله أجمل مما تتخيل.",
"لا تحزن، فالله معك دائمًا.",
"إن مع العسر يسرا.",
"ربك أرحم بك مما تظن.",
"سيأتيك الفرج بطريقة لا تتوقعها.",
"ثق أن الخير قادم ولو طال الانتظار.",

"خذ نفسًا واهدأ، كل شيء سيكون بخير.",
"لا شيء يستحق أن يرهق قلبك.",
"الله يختار لك الأفضل دائمًا.",
"ستفرح قريبًا بإذن الله.",
"اصبر فالعوض قريب.",
"كل تأخير فيه حكمة.",
"الله معك حتى في أصعب لحظاتك.",
"لا تقلق، القادم أجمل.",
"دع الأمور لله فهو أرحم بك.",
"ابتسم فهناك خير ينتظرك.",

"كل يوم بداية جديدة.",
"أنت أقوى مما تظن.",
"لا تستسلم الآن.",
"النجاح قريب منك.",
"حاول مرة أخرى.",
"تعبك لن يضيع.",
"أنت على الطريق الصحيح.",
"استمر ولا تتوقف.",
"كل خطوة تقربك من حلمك.",
"ثق بنفسك وبالله.",

"الصبر مفتاح الفرج.",
"بعد الصبر يأتي العوض.",
"الله لا يضيع أجر الصابرين.",
"كل تأخير لحكمة.",
"اصبر فالله يراك.",
"الجميل يأتي بعد الصبر.",
"اصبر قليلاً وسترى الخير.",
"الفجر يأتي بعد الظلام.",
"الصبر يجلب المعجزات.",
"اصبر فالله كريم.",

"ادعُ الله دائمًا.",
"الله يسمعك حتى لو لم تتكلم.",
"الدعاء يغيّر كل شيء.",
"ارفع يديك واطمئن.",
"الله قريب يجيب الدعاء.",
"ثق بإجابة الله.",
"لا تيأس من الدعاء.",
"الله أرحم من همك.",
"ادعُ وسيأتيك الخير.",
"الله يختار لك الأفضل.",

"سلامك الداخلي أهم شيء.",
"لا تؤذي قلبك بالتفكير الزائد.",
"كن لطيفًا مع نفسك.",
"أنت بخير حتى لو لم تشعر.",
"اهدأ، كل شيء سيمر.",
"لا أحد يستحق توترك.",
"سامح نفسك.",
"راحة بالك أهم من كل شيء.",
"ابتعد عن ما يؤذيك.",
"كن بخير لأجلك.",

"سترى الخير قريبًا.",
"كل يوم يحمل رزقًا جديدًا.",
"الله كريم جدًا.",
"القادم أجمل مما تتوقع.",
"لا تقلق على الغد.",
"ربك لن يتركك.",
"كل شيء سيكون جميلًا.",
"ستبتسم قريبًا.",
"الله معك دائمًا.",
"ثق بالله فقط."
];

// اختيار رسالة اليوم
const today = new Date();

const dateKey = today.getFullYear() + "-" + (today.getMonth() + 1) + "-" + today.getDate();

let hash = 0;
for (let i = 0; i < dateKey.length; i++) {
hash = dateKey.charCodeAt(i) + ((hash << 5) - hash);
}

const index = Math.abs(hash) % messages.length;

// عرض الرسالة داخل الموقع
document.addEventListener("DOMContentLoaded", () => {
const box = document.querySelector(".message");

if (box) {
box.innerHTML = `
<div style="font-size:18px; line-height:2; color:#4f7f76;">
<div style="font-weight:bold; margin-bottom:10px;">✨ رسالة اليوم</div>
<div>${messages[index]}</div>
</div>
`;
}
});
</script>
