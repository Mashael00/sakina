<h1>سَّكِينَة</h1>

<p>
هنا تجد ما يطمئن قلبك.
</p>
<div class="daily-message">

<h2>✨ رسالة اليوم</h2>

<p class="message">
لعلّ ما أخّره الله عنك، خيرٌ لك.
</p>

</div>
</div>
<script>
const messages = [
"لعلّ الله يدبر لك ما هو خير مما تتمنى.",
"اطمئن، ما كُتب لك سيأتيك ولو تأخر.",
"الله لا ينسى قلبًا دعاه.",
"كل تأخير فيه لطف لا تدركه الآن.",
"ما عند الله أجمل مما تتخيل.",
"لا تحزن، فالله معك دائمًا.",
"إن مع العسر يسرا.",
"ربك أرحم بك مما تظن.",
"سيأتيك الفرج بطريقة لا تتوقعها.",
"ثق أن الخير قادم ولو طال الانتظار.",

"خذ نفسًا عميقًا، كل شيء سيكون بخير.",
"لا شيء يستحق أن يرهق قلبك.",
"دع الأمور تسير كما كتبها الله.",
"الراحة قريبة أكثر مما تتصور.",
"لا تُثقل قلبك بما لا تملك تغييره.",
"اهدأ، فكل شيء بوقته الجميل.",
"ستبتسم قريبًا دون سبب.",
"ما يرهقك الآن سيصبح ذكرى.",
"راحة بالك أهم من كل شيء.",
"دع القلق وابتسم.",

"غدًا أجمل بإذن الله.",
"بعد الصبر يأتي العوض.",
"لا تفقد الأمل مهما كان.",
"كل يوم فرصة جديدة.",
"القادم أجمل بكثير.",
"لا شيء يدوم سوى رحمة الله.",
"الحياة تبدأ من جديد كل يوم.",
"اجعل الأمل رفيقك دائمًا.",
"ستصل لما تتمنى.",
"لا تستسلم الآن.",

"أنت أقوى مما تظن.",
"استمر، النجاح قريب.",
"لا تقارن نفسك بأحد.",
"أنت في الطريق الصحيح.",
"حاول مرة أخرى.",
"اجعل اليوم بداية جديدة.",
"تعبك لن يضيع.",
"اصنع نفسك بنفسك.",
"كل خطوة تقربك.",
"أنت قادر على التغيير.",

"الصبر مفتاح الفرج.",
"اصبر فالله لا يضيع أجر الصابرين.",
"الجميل يأتي بعد الصبر.",
"كل تأخير لحكمة.",
"اصبر فالله يراك.",
"لا تستعجل الفرج.",
"بعد الصبر يأتي العوض.",
"اصبر قليلاً وسترى الخير.",
"الله يختبر صبرك لا ضعفك.",
"الصبر جميل.",

"توكل على الله وكفى.",
"ادعُ الله ولا تيأس.",
"الله يسمعك دائمًا.",
"ارفع يديك واطمئن.",
"الدعاء يغيّر كل شيء.",
"الله قريب يجيب الدعاء.",
"لا شيء يعجز الله.",
"ثق بالإجابة.",
"الله أرحم من همك.",
"ادعُ وسيأتيك الخير.",

"السلام يبدأ من داخلك.",
"كن لطيفًا مع نفسك.",
"لا تؤذي قلبك بالتفكير الزائد.",
"أنت بخير حتى لو لم تشعر.",
"اهدأ أنت كافٍ.",
"لا تحمل نفسك أكثر مما تطيق.",
"سلامك الداخلي أهم من كل شيء.",
"سامح نفسك.",
"لا أحد يستحق توترك.",
"كن بخير لأجلك.",

"كل شيء سيكون جميلًا.",
"كن بخير.",
"الله معك.",
"ستتيسر الأمور.",
"لا تقلق.",
"ابتسم الآن.",
"أنت بخير دائمًا.",
"أجمل الأقدار قادمة.",
"ربك كريم.",
"كل يوم بداية جديدة."
];

// اختيار رسالة حسب اليوم
const today = new Date();
const index = today.getDate() % messages.length;

// عرض الرسالة
document.addEventListener("DOMContentLoaded", () => {
const box = document.querySelector(".message, #message, .daily-message");

if (box) {
box.textContent = messages[index];
}
});
</script>
